services:
  - type: web
    name: shippingflow-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    disk:
      name: shippingflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SHIPPINGFLOW_DATABASE
        value: /var/data/shippingflow.db
      - key: SHIPPINGFLOW_SKIP_LEGACY_IMPORT
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: HOST
        value: 0.0.0.0
